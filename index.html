<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Coleta de Resíduos</title>

    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex; /* Divide a tela em duas partes */
            height: 100vh;
        }

        /* Menu lateral para o formulário */
        #sidebar {
            width: 350px;
            padding: 20px;
            background-color: #f8f9fa;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 1000;
            overflow-y: auto;
        }

        #map {
            flex-grow: 1; /* O mapa ocupa o resto da tela */
        }

        /* Estilos básicos do formulário */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        button:hover { background-color: #218838; }
        .dica { font-size: 12px; color: #666; margin-top: 2px;}
    </style>
</head>
<body>

    <!-- PAINEL LATERAL (Formulário) -->
    <div id="sidebar">
        <h2>Cadastrar Ecoponto</h2>
        <form id="formCadastro">
            <div class="form-group">
                <label>Nome do Local</label>
                <input type="text" id="nome" required placeholder="Ex: Ecoponto Centro">
            </div>
            
            <div class="form-group">
                <label>Endereço</label>
                <input type="text" id="endereco" required placeholder="Rua, número, bairro">
            </div>

            <div class="form-group">
                <label>Latitude</label>
                <input type="number" step="any" id="latitude" required readonly>
                <div class="dica">👆 Clique no mapa para preencher</div>
            </div>

            <div class="form-group">
                <label>Longitude</label>
                <input type="number" step="any" id="longitude" required readonly>
            </div>

            <div class="form-group">
                <label>Materiais Aceitos</label>
                <input type="text" id="materiais" required placeholder="Vidro, papel, plástico, eletrônicos">
            </div>

            <div class="form-group">
                <label>Horário de Funcionamento</label>
                <input type="text" id="horario" required placeholder="Seg-Sex, 08h às 18h">
            </div>

            <button type="submit" id="btnSalvar">Salvar no Banco</button>
        </form>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- Bibliotecas JS (Leaflet e Supabase) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. CONFIGURAÇÃO DO SUPABASE (COLE SUAS CHAVES AQUI)
        const supabaseUrl = 'https://jvkfcdieamtemdmsamzu.supabase.co';
        const supabaseKey = 'sb_publishable_73jHJO_ez-Pv5tYwXdbYfA_8K2R0VgU';
        
        // CORREÇÃO: Mudamos o nome da variável para supabaseClient
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. CONFIGURAÇÃO DO MAPA
        const map = L.map('map').setView([-29.6842, -53.8069], 13);
        
        // Ajuste de layout para garantir que o mapa carregue o tamanho correto
        setTimeout(function() {
            map.invalidateSize();
        }, 100);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
        }).addTo(map);

        // 3. EVENTO: CLIQUE NO MAPA PARA PEGAR COORDENADAS
        let marcadorTemporario = null;
        map.on('click', function(e) {
            document.getElementById('latitude').value = e.latlng.lat;
            document.getElementById('longitude').value = e.latlng.lng;

            if (marcadorTemporario) { map.removeLayer(marcadorTemporario); }
            marcadorTemporario = L.marker(e.latlng).addTo(map)
                .bindPopup("Novo ponto selecionado!").openPopup();
        });

        // 4. FUNÇÃO: BUSCAR E EXIBIR PONTOS CADASTRADOS
        async function carregarPontos() {
            // CORREÇÃO: Usando supabaseClient
            const { data, error } = await supabaseClient.from('pontos_de_coleta').select('*');
            if (error) return console.error("Erro ao buscar:", error);

            data.forEach(ponto => {
                L.marker([ponto.latitude, ponto.longitude]).addTo(map)
                    .bindPopup(`
                        <b>${ponto.nome}</b><br>
                        ${ponto.endereco}<br><br>
                        <b>Materiais:</b> ${ponto.materiais}<br>
                        <b>Horário:</b> ${ponto.horario}
                    `);
            });
        }

        // 5. EVENTO: SALVAR NOVO PONTO NO BANCO
        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "Salvando...";

            // Coleta os dados e força as coordenadas a serem números (float)
            const novoPonto = {
                nome: document.getElementById('nome').value,
                endereco: document.getElementById('endereco').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                materiais: document.getElementById('materiais').value,
                horario: document.getElementById('horario').value
            };

            console.log("Tentando enviar os seguintes dados:", novoPonto);

            const { data, error } = await supabaseClient.from('pontos_de_coleta').insert([novoPonto]);

            if (error) {
                // Agora o alerta vai mostrar EXATAMENTE o que o Supabase reclamou
                alert("O Supabase recusou os dados. Erro: " + error.message);
                console.error("ERRO COMPLETO DO SUPABASE:", error);
            } else {
                alert("Ponto cadastrado com sucesso!");
                document.getElementById('formCadastro').reset(); 
                if (marcadorTemporario) { map.removeLayer(marcadorTemporario); } 
                carregarPontos(); 
            }
            
            btn.innerText = "Salvar no Banco";
        });

        carregarPontos();
    </script>
</body>
</html>
